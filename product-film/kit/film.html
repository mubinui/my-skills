<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product film</title>
<style>
  /* The film's look. Change the tokens, not the structure: engine.js positions
     #win, #cam, titles and captions from film.config.json. */
  :root {
    --ink: #1d1d1f;
    --dim: #6e6e73;
    --paper: #f2f2f5;
    --night: #0c0c0f;
    --ok: #248a3d;
    --bad: #d70015;
    --wash-a: 12,143,126;      /* the product's two brand hues, as r,g,b */
    --wash-b: 110,86,207;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }

  /* Backgrounds: a quiet paper with two slow washes, and a night version. */
  #bg-light { background: var(--paper); }
  #bg-dark { background: var(--night); }
  .wash { position: absolute; width: 1500px; height: 1100px; border-radius: 50%; }
  #bg-light .wash.a { background: radial-gradient(closest-side, rgba(var(--wash-a),.16), rgba(var(--wash-a),0)); left: -420px; top: -380px; }
  #bg-light .wash.b { background: radial-gradient(closest-side, rgba(var(--wash-b),.16), rgba(var(--wash-b),0)); right: -460px; bottom: -420px; }
  #bg-dark .wash.a { background: radial-gradient(closest-side, rgba(var(--wash-a),.12), rgba(var(--wash-a),0)); left: -500px; top: -420px; }
  #bg-dark .wash.b { background: radial-gradient(closest-side, rgba(var(--wash-b),.14), rgba(var(--wash-b),0)); right: -500px; bottom: -460px; }
  #grid { background-image: radial-gradient(rgba(0,0,0,.10) 1.2px, transparent 1.3px); background-size: 30px 30px; background-position: 15px 15px; }

  /* Chapter titles above the window. */
  .title { position: absolute; }
  .title .kicker { font-size: 19px; font-weight: 600; color: var(--dim); letter-spacing: .005em; }
  .title .head { font-size: 44px; font-weight: 700; letter-spacing: -.024em; margin-top: 6px; line-height: 1.08; }
  .title.on-dark .kicker { color: #a1a1a6; }
  .title.on-dark .head { color: #f5f5f7; }

  /* The app window the screenshots play in. */
  #win { position: absolute; border-radius: 18px; overflow: hidden; background: #fff;
         box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.05), 0 40px 90px -24px rgba(22,22,40,.30); transform-origin: 50% 55%; }
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #shots, #ann { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .shot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #wires { position: absolute; left: 0; top: 0; overflow: visible; }

  /* Marks: ink on the interface, never a brand colour, so they read as annotation. */
  .ring { position: absolute; border: 2.5px solid var(--ink); box-shadow: 0 0 0 5px rgba(29,29,31,.10), 0 6px 18px rgba(0,0,0,.12); }
  .spot { position: absolute; border-radius: 16px; box-shadow: 0 0 0 4000px rgba(14,14,20,.30); }
  .lbl { position: absolute; width: 0; height: 0; }
  .lbl .dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2.5px #fff; }
  .lbl .lead { position: absolute; background: var(--ink); }
  .lbl .pill { position: absolute; white-space: nowrap; background: var(--ink); color: #fff; font-weight: 600; letter-spacing: -.005em;
               border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .cursor { position: absolute; left: 0; top: 0; width: 22px; height: 30px; transform-origin: 2px 2px; }
  .ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2.5px solid var(--ink); background: rgba(29,29,31,.08); }
  .card { position: absolute; background: rgba(255,255,255,.97); border-radius: 16px; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 18px 40px -12px rgba(0,0,0,.25); }

  /* Title cards and pure-animation chapters. */
  .wm { position: absolute; white-space: nowrap; font-weight: 700; letter-spacing: -.035em; color: var(--ink); line-height: 1.12; overflow: hidden; padding: 0 .04em; }
  .wm span { display: inline-block; }
  .tagline { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 31px; font-weight: 500; color: var(--dim); letter-spacing: -.012em; }
  .big { position: absolute; left: 0; width: 1920px; text-align: center; font-weight: 700; letter-spacing: -.032em; color: var(--ink); }
  .cmd { position: absolute; height: 72px; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 24px 50px -24px rgba(20,20,40,.35);
         font-family: var(--mono); font-size: 25px; color: var(--ink); display: flex; align-items: center; padding: 0 30px; white-space: pre; }
  .cmd .ps { color: #a1a1a6; margin-right: 16px; }

  /* Burned-in captions (render with --captions): for feeds that autoplay muted. */
  .caption { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1500px; padding: 10px 22px; border-radius: 14px;
             background: rgba(16,16,20,.82); color: #fff; font-size: 34px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; text-align: center;
             visibility: hidden; z-index: 10; }
  #fade { background: #f7f7f9; z-index: 20; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg-light" class="layer"><div class="wash a"></div><div class="wash b"></div></div>
  <div id="bg-dark" class="layer"><div class="wash a"></div><div class="wash b"></div></div>
  <div id="grid" class="layer"></div>
  <div id="titles" class="layer"></div>
  <div id="win">
    <div id="cam">
      <div id="shots"></div>
      <div id="ann"><svg id="wires"></svg></div>
    </div>
  </div>
  <div id="fx" class="layer"></div>
  <div id="fade" class="layer"></div>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>start();</script>
</body>
</html>
